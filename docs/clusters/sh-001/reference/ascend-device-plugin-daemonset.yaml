apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ascend-device-plugin-daemonset
  namespace: kube-system
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      name: ascend-device-plugin-ds
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-07-30T15:51:07+08:00'
        scheduler.alpha.kubernetes.io/critical-pod: ''
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
      labels:
        name: ascend-device-plugin-ds
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: servertype
                operator: NotIn
                values:
                - soc
      containers:
      - args:
        - export LD_LIBRARY_PATH=/user/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64/driver:/usr/local/Ascend/driver/lib64/common:/usr/lib/aarch64-linux-gnu:/usr/lib64:$LD_LIBRARY_PATH;device-plugin
          -volcanoType=false -presetVirtualDevice=true -logFile=/var/log/mindx-dl/devicePlugin/devicePlugin.log
          -logLevel=0 --enable-healthz=true --healthz-address=11251
        command:
        - /bin/bash
        - -c
        - --
        env:
        - name: MOUNT_BY_RUNTIME_FOR_DP
          value: 'true'
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: HOST_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: PRESET_VIRTUAL_DEVICE
          value: 'false'
        image: ascend-k8sdeviceplugin:v26.1.0.beta.2
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 11251
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        name: device-plugin-01
        resources:
          limits:
            cpu: 500m
            memory: 500Mi
          requests:
            cpu: 500m
            memory: 500Mi
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/kubelet/device-plugins
          name: device-plugin
        - mountPath: /etc/vnpu.cfg
          name: vnpucfg
        - mountPath: /run/vnpu_cfg_lock
          name: vnpu-cut
        - mountPath: /var/lib/kubelet/pod-resources
          name: pod-resource
        - mountPath: /usr/local/Ascend/driver
          name: hiai-driver
          readOnly: true
        - mountPath: /var/log/mindx-dl/devicePlugin
          name: log-path
          subPath: mindx-dl/devicePlugin
        - mountPath: /tmp
          name: tmp
        - mountPath: /user/restore/reset
          name: reset-config-dir
        - mountPath: /var/log/lingqu
          name: lingqu-log
        - mountPath: /user/cluster-info/datatrace-config
          name: data-trace-file-dir
        - mountPath: /etc/localtime
          name: localtime
          readOnly: true
        - mountPath: /usr/lib64
          name: lib64
      dnsPolicy: ClusterFirst
      hostNetwork: true
      hostPID: true
      initContainers:
      - command:
        - sh
        - -c
        - mkdir -p /var/log/mindx-dl && chmod 755 /var/log/mindx-dl && chown root:root
          /var/log/mindx-dl && mkdir -p /var/log/mindx-dl/devicePlugin && chmod 750
          /var/log/mindx-dl/devicePlugin && chown root:root /var/log/mindx-dl/devicePlugin
        env:
        - name: PRESET_VIRTUAL_DEVICE
          value: 'false'
        image: ascend-k8sdeviceplugin:v26.1.0.beta.2
        imagePullPolicy: IfNotPresent
        name: init-log-setup
        resources: {}
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/log
          name: log-path
      nodeSelector:
        workerselector: dls-worker-node
      priorityClassName: system-node-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: ascend-device-plugin-sa
      serviceAccountName: ascend-device-plugin-sa
      terminationGracePeriodSeconds: 30
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - effect: NoSchedule
        key: huawei.com/Ascend910
        operator: Exists
      - effect: NoSchedule
        key: huawei.com/Ascend310
        operator: Exists
      - effect: NoSchedule
        key: huawei.com/Ascend310P
        operator: Exists
      - effect: NoSchedule
        key: huawei.com/npu
        operator: Exists
      - effect: NoSchedule
        key: device-plugin
        operator: Equal
        value: v2
      volumes:
      - hostPath:
          path: /var/lib/kubelet/device-plugins
          type: ''
        name: device-plugin
      - hostPath:
          path: /var/lib/kubelet/pod-resources
          type: ''
        name: pod-resource
      - hostPath:
          path: /usr/local/Ascend/driver
          type: ''
        name: hiai-driver
      - hostPath:
          path: /var/log
          type: Directory
        name: log-path
      - hostPath:
          path: /user/restore/reset
          type: DirectoryOrCreate
        name: reset-config-dir
      - hostPath:
          path: /user/cluster-info/datatrace-config
          type: DirectoryOrCreate
        name: data-trace-file-dir
      - hostPath:
          path: /run/vnpu_cfg_lock
          type: DirectoryOrCreate
        name: vnpu-cut
      - hostPath:
          path: /tmp
          type: ''
        name: tmp
      - hostPath:
          path: /etc/vnpu.cfg
          type: File
        name: vnpucfg
      - hostPath:
          path: /var/log/lingqu
          type: DirectoryOrCreate
        name: lingqu-log
      - hostPath:
          path: /etc/localtime
          type: ''
        name: localtime
      - hostPath:
          path: /usr/lib64
          type: ''
        name: lib64
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate

